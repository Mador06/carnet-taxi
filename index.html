<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover : l'app utilise tout l'écran de l'iPhone (encoche comprise) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carnet Taxi</title>
  <meta name="description" content="Carnet de bord taxi – Cannes">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="color-scheme" content="dark">

  <!-- Balises spécifiques iPhone (Safari > Sur l'écran d'accueil) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carnet Taxi">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===================== FEUILLE DU JOUR (écran d'accueil) ===================== -->
  <div id="accueil">
    <header class="entete">
      <div class="nav-date">
        <button type="button" class="fleche" id="jour-precedent" aria-label="Jour précédent">‹</button>
        <button type="button" class="titre-date" id="titre-date" aria-label="Revenir à aujourd'hui"></button>
        <button type="button" class="fleche" id="jour-suivant" aria-label="Jour suivant">›</button>
      </div>
      <button type="button" class="btn-icone" id="btn-reglages" aria-label="Réglages">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </button>
    </header>
    <p class="sous-date" id="sous-date"></p>

    <main class="feuille">
      <section class="resume">
        <div class="total" id="total-jour"></div>
        <div class="detail-total" id="detail-total"></div>
      </section>
      <ul class="liste-jour" id="liste-jour"></ul>
    </main>

    <button type="button" class="fab" id="btn-ajouter" aria-label="Ajouter une course">+</button>
  </div>

  <!-- ===================== FORMULAIRE PRIVÉ ===================== -->
  <section class="ecran" id="ecran-prive" hidden>
    <div class="barre-ecran">
      <button type="button" class="btn-texte" data-fermer-ecran>Annuler</button>
      <h2 id="titre-form-prive">Course privée</h2>
      <span class="barre-espace"></span>
    </div>

    <form id="form-prive" class="formulaire" autocomplete="off">
      <div class="ligne-2">
        <label>Date
          <input type="date" name="date" required>
        </label>
        <label>Heure
          <input type="time" name="heure" required>
        </label>
      </div>

      <label>Station
        <select name="station" required>
          <option>Gare</option>
          <option>Mairie</option>
          <option>Palais</option>
          <option>Majestic</option>
          <option>Marriott</option>
          <option>Carlton</option>
          <option>Martinez</option>
          <option>Palm Beach</option>
          <option>Baoli</option>
        </select>
      </label>

      <div class="ligne-2">
        <label>Prix (€)
          <input type="text" name="prix" inputmode="decimal" placeholder="0,00" required>
        </label>
        <label>Paiement
          <select name="paiement" required>
            <option>Espèces</option>
            <option>Carte</option>
            <option>Carte+</option>
          </select>
        </label>
      </div>

      <button type="submit" class="btn btn-principal" id="btn-valider-prive">Ajouter la course</button>
      <button type="button" class="btn btn-danger" id="btn-supprimer-prive" hidden>Supprimer la course</button>
    </form>
  </section>

  <!-- ===================== FORMULAIRE MÉDICAL ===================== -->
  <section class="ecran" id="ecran-medical" hidden>
    <div class="barre-ecran">
      <button type="button" class="btn-texte" data-fermer-ecran>Annuler</button>
      <h2 id="titre-form-medical">Course médicale</h2>
      <span class="barre-espace"></span>
    </div>

    <form id="form-medical" class="formulaire" autocomplete="off">
      <div class="ligne-2">
        <label>Date
          <input type="date" name="date" required>
        </label>
        <label>Heure
          <input type="time" name="heure" required>
        </label>
      </div>

      <label>Nom / Prénom
        <input type="text" name="nom" autocapitalize="words" required>
      </label>

      <label>Téléphone
        <input type="tel" name="telephone" inputmode="tel" placeholder="06 12 34 56 78">
      </label>

      <div class="champ-adresse">
        <label for="adresse-depart">Adresse client</label>
        <input type="text" name="adresseDepart" id="adresse-depart" placeholder="Adresse ou lieu (ex. hôpital Pasteur)" autocomplete="off">
      </div>

      <div class="champ-adresse">
        <label for="adresse-arrivee">Adresse d'arrivée</label>
        <input type="text" name="adresseArrivee" id="adresse-arrivee" placeholder="Adresse ou lieu (ex. hôpital Pasteur)" autocomplete="off">
      </div>

      <div class="ligne-2">
        <label>Trajet
          <select name="trajet">
            <option>Aller</option>
            <option>Aller/Retour</option>
            <option>Retour</option>
          </select>
        </label>
        <label>Km (un trajet)
          <input type="text" name="km" inputmode="decimal" placeholder="0">
        </label>
      </div>
      <p class="info-km" id="info-km"></p>

      <div class="ligne-2">
        <label>Prise en charge
          <select name="priseEnCharge">
            <option>Consultation</option>
            <option>HDJ</option>
          </select>
        </label>
        <label>Prix (€)
          <input type="text" name="prix" inputmode="decimal" placeholder="0,00">
        </label>
      </div>

      <button type="submit" class="btn btn-principal" id="btn-valider-medical">Ajouter la course</button>
      <button type="button" class="btn btn-danger" id="btn-supprimer-medical" hidden>Supprimer la course</button>
    </form>
  </section>

  <!-- ===================== PANNEAU « + » ===================== -->
  <dialog class="panneau" id="panneau-ajout">
    <h2>Nouvelle course</h2>
    <div class="choix-type">
      <button type="button" class="choix" data-nouvelle="prive">
        <span class="choix-lettre">P</span>Privé
      </button>
      <button type="button" class="choix" data-nouvelle="medical">
        <span class="choix-lettre choix-lettre-m">M</span>Médical
      </button>
    </div>
    <button type="button" class="btn btn-fermer" data-fermer-panneau>Annuler</button>
  </dialog>

  <!-- ===================== RÉGLAGES ===================== -->
  <dialog class="panneau" id="dlg-reglages">
    <h2>Réglages</h2>

    <h3>Sauvegarde</h3>
    <p class="texte-doux">Vos données restent uniquement sur ce téléphone. Faites une sauvegarde régulièrement (par exemple chaque semaine) et rangez le fichier dans « Fichiers » ou iCloud.</p>
    <button type="button" class="btn btn-secondaire" id="btn-export-json">Exporter toutes les données</button>
    <button type="button" class="btn btn-secondaire" id="btn-import-json">Restaurer depuis un fichier…</button>
    <input type="file" id="fichier-import" accept=".json,application/json" hidden>

    <h3>Export pour Excel (CSV)</h3>
    <div class="ligne-2">
      <button type="button" class="btn btn-secondaire" data-csv="prive">Privé</button>
      <button type="button" class="btn btn-secondaire" data-csv="medical">Médical</button>
    </div>

    <button type="button" class="btn btn-fermer" data-fermer-panneau>Fermer</button>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/db.js"></script>
  <script src="js/recherche-lieux.js"></script>
  <script src="js/adresses.js"></script>
  <script src="js/tarif-medical.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
